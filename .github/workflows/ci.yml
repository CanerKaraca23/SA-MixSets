name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone Plugin SDK
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git "$env:RUNNER_TEMP\plugin-sdk"

      - name: Get Plugin SDK SHA
        id: sdk-sha
        run: |
          $sha = git -C "$env:RUNNER_TEMP\plugin-sdk" rev-parse --short HEAD
          "sha=$sha" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Cache Plugin SDK library
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\sdk-lib-cache
          key: plugin-sdk-x86-v143-${{ steps.sdk-sha.outputs.sha }}

      - name: Build Plugin SDK library
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Set up MSVC x86 environment
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "`"$vcvars`" x86 >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process') }
          }

          $SDK    = "$env:RUNNER_TEMP\plugin-sdk"
          $OBJ    = "$env:RUNNER_TEMP\sdk_obj"
          $OUTLIB = "$SDK\output\lib\plugin.lib"
          New-Item -Force -ItemType Directory "$SDK\output\lib", $OBJ | Out-Null

          $INC  = "/I`"$SDK\plugin_sa`"", "/I`"$SDK\plugin_sa\game_sa`"", "/I`"$SDK\plugin_sa\game_sa\rw`"", "/I`"$SDK\shared`"", "/I`"$SDK\shared\game`"", "/I`"$SDK\safetyhook`"", "/I`"$SDK\injector`""
          $OPTS = '/c', '/nologo', '/W0', '/EHsc', '/MT', '/std:c++latest', '/permissive', '/MP', '/DGTASA', '/DRW', '/DPLUGIN_SGV_10US', '/D_CRT_SECURE_NO_WARNINGS', '/D_NDEBUG'

          # Compile each source group into its own output subdirectory to avoid name collisions
          foreach ($group in @(
            @{ Dir = "$SDK\plugin_sa\game_sa"; Out = "game_sa" },
            @{ Dir = "$SDK\shared";            Out = "shared" },
            @{ Dir = "$SDK\shared\game";       Out = "shared_game" },
            @{ Dir = "$SDK\shared\extensions"; Out = "shared_ext" }
          )) {
            $files = (Get-ChildItem $group.Dir -Filter "*.cpp").FullName
            if ($files.Count -eq 0) { continue }
            $foDir = New-Item -Force -ItemType Directory "$OBJ\$($group.Out)"
            $rsp   = "$OBJ\$($group.Out).rsp"
            $files | Set-Content $rsp
            Write-Host "Compiling $($files.Count) files from $($group.Dir)..."
            & cl.exe @OPTS @INC "/Fo$foDir\" "@$rsp"
            if ($LASTEXITCODE -ne 0) { throw "Compilation failed for $($group.Dir)" }
          }

          # safetyhook.cpp (C++)
          $foSafe = New-Item -Force -ItemType Directory "$OBJ\safetyhook"
          & cl.exe @OPTS @INC "/Fo$foSafe\" "$SDK\safetyhook\safetyhook.cpp"
          if ($LASTEXITCODE -ne 0) { throw "safetyhook compilation failed" }

          # Zydis.c (C — no C++ flags)
          & cl.exe /c /nologo /W0 /MT @INC "/Fo$foSafe\Zydis.obj" "$SDK\safetyhook\Zydis.c"
          if ($LASTEXITCODE -ne 0) { throw "Zydis.c compilation failed" }

          # Archive into plugin.lib
          $objs = (Get-ChildItem $OBJ -Recurse -Filter "*.obj").FullName
          & lib.exe /NOLOGO "/OUT:$OUTLIB" @objs
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed" }

          # Save to cache
          New-Item -Force -ItemType Directory "$env:RUNNER_TEMP\sdk-lib-cache" | Out-Null
          Copy-Item $OUTLIB "$env:RUNNER_TEMP\sdk-lib-cache\"
          Write-Host "plugin.lib built and cached."

      - name: Restore cached Plugin SDK library
        if: steps.cache-sdk.outputs.cache-hit == 'true'
        run: |
          New-Item -Force -ItemType Directory "$env:RUNNER_TEMP\plugin-sdk\output\lib" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\sdk-lib-cache\plugin.lib" "$env:RUNNER_TEMP\plugin-sdk\output\lib\"
          Write-Host "plugin.lib restored from cache."

      - name: Build
        run: |
          msbuild MixSets.sln `
            /p:Configuration="GTASA Release" `
            /p:Platform=x86 `
            /p:OutDir="$env:GITHUB_WORKSPACE\build\" `
            /p:PLUGIN_SDK_DIR="$env:RUNNER_TEMP\plugin-sdk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixSets
          path: build/MixSets.asi
          if-no-files-found: error
