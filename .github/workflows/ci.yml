name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone Plugin SDK
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git "$env:RUNNER_TEMP\plugin-sdk"

      - name: Get Plugin SDK SHA
        id: sdk-sha
        run: |
          $sha = git -C "$env:RUNNER_TEMP\plugin-sdk" rev-parse --short HEAD
          "sha=$sha" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Cache Plugin SDK library
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\sdk-lib-cache
          key: plugin-sdk-x86-v143-${{ steps.sdk-sha.outputs.sha }}

      - name: Build Plugin SDK library
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86

          set SDK=%RUNNER_TEMP%\plugin-sdk
          set OBJDIR=%RUNNER_TEMP%\sdk_obj
          set OUTLIB=%SDK%\output\lib\plugin.lib

          mkdir "%SDK%\output\lib"
          mkdir "%OBJDIR%\game_sa" "%OBJDIR%\shared" "%OBJDIR%\shared_game" "%OBJDIR%\shared_ext" "%OBJDIR%\safetyhook"

          set OPTS=/c /nologo /W0 /EHsc /MT /std:c++latest /permissive /MP /DGTASA /DRW /DPLUGIN_SGV_10US /D_CRT_SECURE_NO_WARNINGS /D_NDEBUG
          set INC=/I"%SDK%\plugin_sa" /I"%SDK%\plugin_sa\game_sa" /I"%SDK%\plugin_sa\game_sa\rw" /I"%SDK%\shared" /I"%SDK%\shared\game" /I"%SDK%\safetyhook" /I"%SDK%\injector"

          echo Generating response files...
          for %%f in ("%SDK%\plugin_sa\game_sa\*.cpp") do echo "%%f" >> "%OBJDIR%\rsp_game_sa.txt"
          for %%f in ("%SDK%\shared\*.cpp") do echo "%%f" >> "%OBJDIR%\rsp_shared.txt"
          for %%f in ("%SDK%\shared\game\*.cpp") do echo "%%f" >> "%OBJDIR%\rsp_shared_game.txt"
          for %%f in ("%SDK%\shared\extensions\*.cpp") do echo "%%f" >> "%OBJDIR%\rsp_shared_ext.txt"

          echo Compiling game_sa...
          cl %OPTS% %INC% /Fo"%OBJDIR%\game_sa\" @"%OBJDIR%\rsp_game_sa.txt"
          if errorlevel 1 exit /b 1

          echo Compiling shared...
          cl %OPTS% %INC% /Fo"%OBJDIR%\shared\" @"%OBJDIR%\rsp_shared.txt"
          if errorlevel 1 exit /b 1

          echo Compiling shared/game...
          cl %OPTS% %INC% /Fo"%OBJDIR%\shared_game\" @"%OBJDIR%\rsp_shared_game.txt"
          if errorlevel 1 exit /b 1

          echo Compiling shared/extensions...
          cl %OPTS% %INC% /Fo"%OBJDIR%\shared_ext\" @"%OBJDIR%\rsp_shared_ext.txt"
          if errorlevel 1 exit /b 1

          echo Compiling safetyhook...
          cl %OPTS% %INC% /Fo"%OBJDIR%\safetyhook\safetyhook.obj" "%SDK%\safetyhook\safetyhook.cpp"
          if errorlevel 1 exit /b 1
          cl /c /nologo /W0 /MT %INC% /Fo"%OBJDIR%\safetyhook\Zydis.obj" "%SDK%\safetyhook\Zydis.c"
          if errorlevel 1 exit /b 1

          echo Creating plugin.lib...
          lib /NOLOGO /OUT:"%OUTLIB%" "%OBJDIR%\game_sa\*.obj" "%OBJDIR%\shared\*.obj" "%OBJDIR%\shared_game\*.obj" "%OBJDIR%\shared_ext\*.obj" "%OBJDIR%\safetyhook\*.obj"
          if errorlevel 1 exit /b 1

          mkdir "%RUNNER_TEMP%\sdk-lib-cache"
          copy "%OUTLIB%" "%RUNNER_TEMP%\sdk-lib-cache\"
          echo plugin.lib built and cached.

      - name: Restore cached Plugin SDK library
        if: steps.cache-sdk.outputs.cache-hit == 'true'
        run: |
          New-Item -Force -ItemType Directory "$env:RUNNER_TEMP\plugin-sdk\output\lib" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\sdk-lib-cache\plugin.lib" "$env:RUNNER_TEMP\plugin-sdk\output\lib\"

      - name: Build
        run: |
          msbuild MixSets.sln `
            /p:Configuration="GTASA Release" `
            /p:Platform=x86 `
            /p:OutDir="$env:GITHUB_WORKSPACE\build\" `
            /p:PLUGIN_SDK_DIR="$env:RUNNER_TEMP\plugin-sdk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixSets
          path: build/MixSets.asi
          if-no-files-found: error
