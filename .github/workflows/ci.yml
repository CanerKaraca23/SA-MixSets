name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone Plugin SDK
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git "$env:RUNNER_TEMP\plugin-sdk"

      - name: Get Plugin SDK SHA
        id: sdk-sha
        run: |
          $sha = git -C "$env:RUNNER_TEMP\plugin-sdk" rev-parse --short HEAD
          "sha=$sha" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Cache Plugin SDK library
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\sdk-lib-cache
          key: plugin-sdk-premake-v143-${{ steps.sdk-sha.outputs.sha }}

      - name: Generate Plugin SDK project
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: cmd
        run: '"%RUNNER_TEMP%\plugin-sdk\tools\premake\premake5" vs2022 --file="%RUNNER_TEMP%\plugin-sdk\tools\premake\premake5.lua"'

      - name: Build Plugin SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          msbuild "%RUNNER_TEMP%\plugin-sdk\plugin.sln" /p:Configuration=Release /p:Platform="Mixed Platforms" /t:plugin_sa /m
          mkdir "%RUNNER_TEMP%\sdk-lib-cache"
          copy "%RUNNER_TEMP%\plugin-sdk\output\lib\plugin.lib" "%RUNNER_TEMP%\sdk-lib-cache\"

      - name: Restore cached Plugin SDK library
        if: steps.cache-sdk.outputs.cache-hit == 'true'
        run: |
          New-Item -Force -ItemType Directory "$env:RUNNER_TEMP\plugin-sdk\output\lib" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\sdk-lib-cache\plugin.lib" "$env:RUNNER_TEMP\plugin-sdk\output\lib\"

      - name: Build
        run: |
          msbuild MixSets.sln `
            /p:Configuration="GTASA Release" `
            /p:Platform=x86 `
            /p:OutDir="$env:GITHUB_WORKSPACE\build\" `
            /p:PLUGIN_SDK_DIR="$env:RUNNER_TEMP\plugin-sdk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixSets
          path: build/MixSets.asi
          if-no-files-found: error
